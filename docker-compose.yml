services:

  # ─── Bases de datos ───────────────────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: biblioteca_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2305
    ports: ["5432:5432"]
    volumes: [pgdata-auth:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

  postgres-usuarios:
    image: postgres:16-alpine
    container_name: postgres-usuarios
    environment:
      POSTGRES_DB: biblioteca_usuarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2305
    ports: ["5433:5432"]
    volumes: [pgdata-usuarios:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

  postgres-recursos:
    image: postgres:16-alpine
    container_name: postgres-recursos
    environment:
      POSTGRES_DB: biblioteca_recursos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2305
    ports: ["5434:5432"]
    volumes: [pgdata-recursos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_recursos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

  postgres-valoraciones:
    image: postgres:16-alpine
    container_name: postgres-valoraciones
    environment:
      POSTGRES_DB: biblioteca_valoraciones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2305
    ports: ["5435:5432"]
    volumes: [pgdata-valoraciones:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_valoraciones"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

  postgres-descargas:
    image: postgres:16-alpine
    container_name: postgres-descargas
    environment:
      POSTGRES_DB: biblioteca_descargas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2305
    ports: ["5436:5432"]
    volumes: [pgdata-descargas:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_descargas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

  postgres-reportes:
    image: postgres:16-alpine
    container_name: postgres-reportes
    environment:
      POSTGRES_DB: biblioteca_reportes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2305
    ports: ["5437:5432"]
    volumes: [pgdata-reportes:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_reportes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

  postgres-notificaciones:
    image: postgres:16-alpine
    container_name: postgres-notificaciones
    environment:
      POSTGRES_DB: biblioteca_notificaciones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2305
    ports: ["5438:5432"]
    volumes: [pgdata-notificaciones:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_notificaciones"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [biblioteca-net]

  # ─── Microservicios ────────────────────────────────────────────────────────

  ms-auth:
    build:
      context: ./ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/biblioteca_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2305
      JWT_SECRET: BibliotecaDigital2025SecretKeyMustBe32CharsLong!!
      JWT_EXPIRATION_MS: 28800000
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks: [biblioteca-net]
    restart: unless-stopped

  ms-usuarios:
    build:
      context: ./ms-usuarios
      dockerfile: Dockerfile
    container_name: ms-usuarios
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-usuarios:5432/biblioteca_usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2305
      JWT_SECRET: BibliotecaDigital2025SecretKeyMustBe32CharsLong!!
    depends_on:
