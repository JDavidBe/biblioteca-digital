        condition: service_healthy
    networks: [biblioteca-net]
    restart: unless-stopped

  ms-recursos:
    build:
      context: ./ms-recursos
      dockerfile: Dockerfile
    container_name: ms-recursos
    ports: ["8082:8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-recursos:5432/biblioteca_recursos
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2305
      JWT_SECRET: BibliotecaDigital2025SecretKeyMustBe32CharsLong!!
    volumes:
      - recursos-uploads:/app/uploads
    depends_on:
      postgres-recursos:
        condition: service_healthy
    networks: [biblioteca-net]
    restart: unless-stopped

  ms-valoraciones:
    build:
      context: ./ms-valoraciones
      dockerfile: Dockerfile
    container_name: ms-valoraciones
    ports: ["8083:8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-valoraciones:5432/biblioteca_valoraciones
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2305
      JWT_SECRET: BibliotecaDigital2025SecretKeyMustBe32CharsLong!!
    depends_on:
      postgres-valoraciones:
        condition: service_healthy
    networks: [biblioteca-net]
    restart: unless-stopped

  ms-descargas:
    build:
      context: ./ms-descargas
      dockerfile: Dockerfile
    container_name: ms-descargas
    ports: ["8084:8084"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-descargas:5432/biblioteca_descargas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2305
      JWT_SECRET: BibliotecaDigital2025SecretKeyMustBe32CharsLong!!
    depends_on:
      postgres-descargas:
        condition: service_healthy
    networks: [biblioteca-net]
    restart: unless-stopped

  ms-reportes:
    build:
      context: ./ms-reportes
      dockerfile: Dockerfile
    container_name: ms-reportes
    ports: ["8085:8085"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-reportes:5432/biblioteca_reportes
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2305
      JWT_SECRET: BibliotecaDigital2025SecretKeyMustBe32CharsLong!!
    depends_on:
      postgres-reportes:
        condition: service_healthy
    networks: [biblioteca-net]
    restart: unless-stopped

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
      dockerfile: Dockerfile
    container_name: ms-notificaciones
    ports: ["8086:8086"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notificaciones:5432/biblioteca_notificaciones
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2305
      JWT_SECRET: BibliotecaDigital2025SecretKeyMustBe32CharsLong!!
      MAIL_USERNAME: johanstevenalvarezrodriguez@gmail.com
      MAIL_PASSWORD: useyflvfkgngxrdc
    depends_on:
      postgres-notificaciones:
        condition: service_healthy
    networks: [biblioteca-net]
    restart: unless-stopped

networks:
  biblioteca-net:
    driver: bridge

volumes:
  pgdata-auth:
  pgdata-usuarios:
  pgdata-recursos:
  pgdata-valoraciones:
  pgdata-descargas:
  pgdata-reportes:
  pgdata-notificaciones:
  recursos-uploads:
