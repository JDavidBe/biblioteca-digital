name: CI - Biblioteca Digital Microservicios
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test-ms-auth:
    name: "ms-auth"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew check jacocoTestReport --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-ms-auth
          path: ms-auth/build/reports/jacoco/
