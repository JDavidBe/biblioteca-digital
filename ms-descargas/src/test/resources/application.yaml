spring:
  application:
    name: ms-descargas-test
  datasource:
    url: jdbc:h2:mem:biblioteca_descargas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false
server:
  port: 0
jwt:
  secret: "TestSecretKeyForJWTBibliotecaDigital2025XYZ!!"
  expiration-ms: 3600000
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
